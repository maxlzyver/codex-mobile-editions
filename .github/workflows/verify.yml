name: Verify dedicated editions
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    name: Mobile browser regression (three editions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-ui" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/mobile-ui/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/mobile-ui/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Verify folding, file links and mobile layout
        run: node tools/test-mobile-ui.mjs
      - name: Verify chat file preview and download
        run: node tools/test-chat-files.mjs
      - name: Verify submitted messages and polling races
        run: node tools/test-message-send-ui.mjs
      - name: Verify mobile permissions, directory picker and release notices
        run: node tools/test-permissions-ui.mjs
  verify:
    name: ${{ matrix.edition }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: windows11
            os: windows-latest
          - edition: windows10
            os: windows-latest
          - edition: macos
            os: macos-15
          - edition: macos
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Verify platform identity and update file hashes
        run: python tools/verify-editions.py --edition ${{ matrix.edition }}
      - name: Run protocol, file access and update tests
        working-directory: editions/${{ matrix.edition }}
        run: node --test test/*.test.mjs
      - name: Check macOS launch scripts
        if: matrix.edition == 'macos'
        run: |
          find editions/macos -name '*.command' -print0 | xargs -0 -n1 /bin/bash -n
      - name: Compile Windows launcher
        if: matrix.edition != 'macos'
        working-directory: editions/${{ matrix.edition }}
        shell: powershell
        run: .\build-launcher.ps1
